<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="chorekit: sort files, undo, folder reports and exchange rates from one command line tool" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#16224a" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0f1f" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0f1f" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="16" fill="#0a0f1f"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>

  <text x="60" y="130" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="72" font-weight="700" fill="#e8ecff">chorekit</text>
  <rect x="60" y="148" width="120" height="6" rx="3" fill="#c6ff4a"/>
  <text x="60" y="198" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#a9b4e0">One command line tool for everyday chores.</text>
  <text x="60" y="230" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#6f7bab">Python, no setup beyond one dependency, 36 unit tests.</text>

  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="16" fill="#c6ff4a">
    <text x="60" y="288">$ python -m chorekit sort ~/Downloads</text>
  </g>

  <!-- 2x2 command cards -->
  <g font-family="Consolas, 'SF Mono', Menlo, monospace">
    <rect x="660" y="50" width="230" height="110" rx="12" fill="#0f1730" stroke="#c6ff4a"/>
    <text x="680" y="88" font-size="26" font-weight="700" fill="#c6ff4a">sort</text>
    <text x="680" y="116" font-size="14" fill="#a9b4e0">by type or by month</text>
    <text x="680" y="138" font-size="14" fill="#6f7bab">--dry-run, --recursive</text>

    <rect x="910" y="50" width="230" height="110" rx="12" fill="#0f1730" stroke="#ff4fa3"/>
    <text x="930" y="88" font-size="26" font-weight="700" fill="#ff4fa3">undo</text>
    <text x="930" y="116" font-size="14" fill="#a9b4e0">puts the last sort back</text>
    <text x="930" y="138" font-size="14" fill="#6f7bab">uses a move log</text>

    <rect x="660" y="180" width="230" height="110" rx="12" fill="#0f1730" stroke="#4fd8ff"/>
    <text x="680" y="218" font-size="26" font-weight="700" fill="#4fd8ff">report</text>
    <text x="680" y="246" font-size="14" fill="#a9b4e0">files and size per type</text>
    <text x="680" y="268" font-size="14" fill="#6f7bab">md, csv or json</text>

    <rect x="910" y="180" width="230" height="110" rx="12" fill="#0f1730" stroke="#ffc84f"/>
    <text x="930" y="218" font-size="26" font-weight="700" fill="#ffc84f">rates</text>
    <text x="930" y="246" font-size="14" fill="#a9b4e0">live exchange rates</text>
    <text x="930" y="268" font-size="14" fill="#6f7bab">retries, convert, csv</text>
  </g>
</svg>
