<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Example run: sort --dry-run output and a report by category (demo folder, made-up sizes)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#16224a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="560" rx="16" fill="#0a0f1f"/>
  <rect width="1200" height="560" rx="16" fill="url(#grid)"/>
  <text x="60" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e8ecff">Example run</text>
  <rect x="215" y="30" width="400" height="28" rx="14" fill="none" stroke="#ff4fa3"/>
  <text x="415" y="49" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ff8cc5">demo folder, made-up file names and sizes</text>

  <!-- terminal -->
  <rect x="40" y="84" width="580" height="440" rx="12" fill="#0d1328" stroke="#26335f"/>
  <rect x="40" y="84" width="580" height="34" rx="12" fill="#141c3a"/>
  <rect x="40" y="106" width="580" height="12" fill="#141c3a"/>
  <circle cx="64" cy="101" r="5" fill="#ff4fa3"/>
  <circle cx="82" cy="101" r="5" fill="#ffc84f"/>
  <circle cx="100" cy="101" r="5" fill="#c6ff4a"/>
  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="14" xml:space="preserve">
    <text x="62" y="148" fill="#e8ecff"><tspan fill="#c6ff4a">$</tspan> python -m chorekit sort ~/Downloads --dry-run</text>
    <text x="62" y="168" fill="#a9b4e0">Sorting files in: /home/me/Downloads</text>
    <text x="62" y="200" fill="#a9b4e0">[dry-run] backup.zip -&gt; Archives/</text>
    <text x="62" y="220" fill="#a9b4e0">[dry-run] clip.mp4 -&gt; Videos/</text>
    <text x="62" y="240" fill="#a9b4e0">[dry-run] holiday.jpg -&gt; Images/</text>
    <text x="62" y="260" fill="#a9b4e0">[dry-run] invoice.pdf -&gt; Documents/</text>
    <text x="62" y="280" fill="#a9b4e0">[dry-run] notes.txt -&gt; Documents/</text>
    <text x="62" y="300" fill="#a9b4e0">[dry-run] photo_02.png -&gt; Images/</text>
    <text x="62" y="320" fill="#a9b4e0">[dry-run] song.mp3 -&gt; Audio/</text>
    <text x="62" y="340" fill="#a9b4e0">[dry-run] tool.py -&gt; Code/</text>
    <text x="62" y="372" fill="#c6ff4a">Summary:</text>
    <text x="62" y="392" fill="#a9b4e0">  Archives: 1 file(s)</text>
    <text x="62" y="412" fill="#a9b4e0">  Audio: 1 file(s)</text>
    <text x="62" y="432" fill="#a9b4e0">  Code: 1 file(s)</text>
    <text x="62" y="452" fill="#a9b4e0">  Documents: 2 file(s)</text>
    <text x="62" y="472" fill="#a9b4e0">  Images: 2 file(s)</text>
    <text x="62" y="492" fill="#a9b4e0">  Videos: 1 file(s)</text>
    </g>

  <!-- report chart -->
  <rect x="660" y="84" width="500" height="250" rx="12" fill="#0d1328" stroke="#26335f"/>
  <text x="684" y="116" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="14" fill="#4fd8ff">chorekit report ~/Downloads</text>
  <text x="684" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a9b4e0">Files: 8, total size: 76.9 MB</text>
  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#a9b4e0">
    <text x="684" y="177">Videos</text>
    <rect x="780" y="164" width="300" height="16" rx="4" fill="#4fd8ff"/>
    <text x="1088" y="177" font-size="12">55.3 MB</text>

    <text x="684" y="205">Archives</text>
    <rect x="780" y="192" width="65" height="16" rx="4" fill="#4fd8ff" fill-opacity="0.85"/>
    <text x="853" y="205" font-size="12">11.9 MB</text>

    <text x="684" y="233">Audio</text>
    <rect x="780" y="220" width="27" height="16" rx="4" fill="#4fd8ff" fill-opacity="0.7"/>
    <text x="815" y="233" font-size="12">4.9 MB</text>

    <text x="684" y="261">Images</text>
    <rect x="780" y="248" width="24" height="16" rx="4" fill="#4fd8ff" fill-opacity="0.7"/>
    <text x="812" y="261" font-size="12">4.4 MB</text>

    <text x="684" y="289">Documents</text>
    <rect x="780" y="276" width="4" height="16" rx="2" fill="#4fd8ff" fill-opacity="0.6"/>
    <text x="792" y="289" font-size="12">413.1 KB</text>

    <text x="684" y="317">Code</text>
    <rect x="780" y="304" width="3" height="16" rx="1.5" fill="#4fd8ff" fill-opacity="0.6"/>
    <text x="791" y="317" font-size="12">3.9 KB</text>
  </g>

  <!-- rates -->
  <rect x="660" y="354" width="500" height="170" rx="12" fill="#0d1328" stroke="#26335f"/>
  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="13">
    <text x="684" y="386" fill="#e8ecff"><tspan fill="#ffc84f">$</tspan> chorekit rates --symbols EUR --convert 100 --to EUR</text>
    <text x="684" y="414" fill="#a9b4e0">Fetching exchange rates relative to USD...</text>
    <text x="684" y="436" fill="#a9b4e0">Done! Got 1 exchange rates, saved to: exchange_rates.json</text>
    <text x="684" y="458" fill="#ffc84f">100 USD = 90.00 EUR</text>
  </g>
  <text x="684" y="500" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6f7bab">rate value in this example is made up, a real run uses the live rate</text>
</svg>
